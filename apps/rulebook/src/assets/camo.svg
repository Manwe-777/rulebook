    <feComponentTransfer>
      <feFuncR type="discrete" tableValues="0.17 0.27 0.40 0.52 0.64" />
      <feFuncG type="discrete" tableValues="0.19 0.29 0.41 0.52 0.62" />
      <feFuncB type="discrete" tableValues="0.15 0.23 0.33 0.42 0.51" />
