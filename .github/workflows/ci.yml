name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # The relay installer under systemd in Docker: install, publish, update, tampered download, uninstall.
  relay-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: apps/relay/tests/installer.sh

  # The app on GitHub Pages (the rulebook, with the list builder under builder/).
  pages:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # /<repo>/ on <user>.github.io; set PAGES_BASE_PATH to / for a custom domain.
      BASE: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
      VITE_RELAYS: ${{ vars.RULEBOOK_RELAYS }}
      VITE_RULEBOOK_OWNER: ${{ vars.RULEBOOK_OWNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app
        run: BASE_PATH=$BASE npm run build -w @rulebook/rulebook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/rulebook/dist
      - id: deploy
        uses: actions/deploy-pages@v4

  # Versions from commit types; each release carries the relay tarball, install.sh and SHA256SUMS.
  release:
    needs: [check, relay-installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Built into install.sh as the default owner.
          RULEBOOK_OWNER: ${{ vars.RULEBOOK_OWNER }}
